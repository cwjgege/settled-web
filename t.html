<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="查看行程、参与投票，并和朋友一起把旅行定下来。">
<meta property="og:type" content="website">
<meta property="og:title" content="Settled，一起决定这趟旅行">
<meta property="og:description" content="查看完整行程，参与同行投票，无需安装 App。">
<meta name="theme-color" content="#edf3ef">
<title>Settled | 一起决定这趟旅行</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
:root{
  color-scheme:light dark;
  --canvas:#edf3ef;--surface:#f8faf8;--surface-strong:#ffffff;--surface-soft:#e5eee9;
  --ink:#14211d;--muted:#5d6e67;--faint:#7b8a84;--line:#d4e0d9;
  --brand:#2f7d70;--brand-strong:#1b564d;--brand-soft:#d9ebe4;
  --shadow:0 18px 54px rgba(28,73,62,.12);--radius:18px;--pill:999px;
}
@media(prefers-color-scheme:dark){
  :root{
    --canvas:#111815;--surface:#17211d;--surface-strong:#1c2823;--surface-soft:#22312b;
    --ink:#eff6f2;--muted:#b5c4bd;--faint:#8fa098;--line:#30423a;
    --brand:#65b6a5;--brand-strong:#9ad3c6;--brand-soft:#243f37;
    --shadow:0 20px 60px rgba(0,0,0,.28)
  }
}
*{box-sizing:border-box}
html{background:var(--canvas);scroll-behavior:smooth}
body{margin:0;min-height:100dvh;background:var(--canvas);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,textarea,input{font:inherit}
button{color:inherit}
button:focus-visible,textarea:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 36%,transparent);outline-offset:3px}
.shell{width:min(1120px,100%);margin:0 auto;padding:0 24px 72px}
.topbar{height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:760;letter-spacing:-.02em}
.brand-mark{width:30px;height:30px;border-radius:10px;background:var(--brand-strong);color:var(--surface-strong);display:grid;place-items:center;font-weight:820;box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.identity{border:1px solid var(--line);background:var(--surface);min-height:40px;padding:0 14px;border-radius:var(--pill);font-size:13px;font-weight:680;cursor:pointer;transition:transform .2s ease,background .2s ease}
.identity:hover{background:var(--surface-strong)}
.identity:active,.action:active,.vote-button:active,.emoji-button:active{transform:translateY(1px) scale(.99)}
.hero{display:grid;grid-template-columns:minmax(0,.9fr) minmax(460px,1.1fr);gap:48px;align-items:center;min-height:min(670px,calc(100dvh - 72px));padding:28px 0 56px}
.hero-copy{max-width:520px}
.hero-note{display:inline-flex;align-items:center;min-height:32px;padding:0 12px;border:1px solid var(--line);border-radius:var(--pill);background:var(--surface);font-size:12px;font-weight:720;color:var(--brand-strong)}
h1{font-size:clamp(42px,6vw,76px);line-height:.96;letter-spacing:-.035em;margin:22px 0 20px;max-width:10ch;text-wrap:balance}
.hero-intro{font-size:17px;line-height:1.6;color:var(--muted);max-width:42ch;margin:0}
.trip-facts{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.fact{min-width:104px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.fact strong{display:block;font-size:17px;letter-spacing:-.02em}
.fact span{display:block;margin-top:3px;font-size:11px;color:var(--faint)}
.media-grid{display:grid;grid-template-columns:1.45fr .85fr;grid-template-rows:1fr 1fr;gap:12px;height:520px}
.media{margin:0;overflow:hidden;border-radius:var(--radius);background:var(--surface-soft);box-shadow:var(--shadow);position:relative}
.media:first-child{grid-row:1/3}
.media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s cubic-bezier(.16,1,.3,1)}
.media:hover img{transform:scale(1.025)}
.section{padding:72px 0 0}
.section-head{max-width:660px;margin-bottom:24px}
.section-head h2{font-size:clamp(28px,4vw,46px);line-height:1.04;letter-spacing:-.045em;margin:0 0 10px}
.section-head p{font-size:15px;line-height:1.6;color:var(--muted);margin:0;max-width:58ch}
.summary-strip{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 20px;background:var(--brand-strong);color:#f4faf7;border-radius:var(--radius);margin-bottom:16px}
.summary-strip strong{font-size:16px}
.summary-strip span{font-size:13px;color:rgba(244,250,247,.76)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 8px 28px rgba(31,75,64,.06)}
.decision{padding:22px;margin-top:14px}
.decision-top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:18px}
.decision-type{font-size:12px;font-weight:760;color:var(--brand-strong);margin-bottom:7px}
.decision h3{font-size:22px;line-height:1.22;letter-spacing:-.025em;margin:0;max-width:32ch}
.deadline{font-size:12px;color:var(--muted);text-align:right;flex:0 0 auto}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.option{border:1px solid var(--line);background:var(--surface-strong);border-radius:15px;overflow:hidden;display:grid;grid-template-columns:132px minmax(0,1fr);min-height:174px;transition:border-color .2s ease,transform .2s ease}
.option:hover{border-color:color-mix(in srgb,var(--brand) 48%,var(--line));transform:translateY(-2px)}
.option.mine{border:2px solid var(--brand);background:var(--brand-soft)}
.option-media{margin:0;background:var(--surface-soft);min-height:174px}
.option-media img{width:100%;height:100%;object-fit:cover;display:block}
.option-body{padding:16px;display:flex;flex-direction:column;align-items:flex-start}
.option-title{font-size:16px;font-weight:760;line-height:1.25}
.option-sub{font-size:12px;color:var(--muted);line-height:1.45;margin-top:4px}
.option-fact{font-size:12px;line-height:1.45;color:var(--muted);margin:12px 0}
.option-price{font-size:13px;font-weight:720;margin-top:8px}
.vote-button{width:100%;min-height:42px;margin-top:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:13px;font-weight:740;cursor:pointer;transition:transform .15s ease,background .2s ease,color .2s ease}
.vote-button:hover{background:var(--surface-soft)}
.vote-button.mine{background:var(--brand-strong);border-color:var(--brand-strong);color:#f4faf7}
.vote-button:disabled,.action:disabled{opacity:.58;cursor:wait}
.vote-meta{display:flex;justify-content:space-between;gap:12px;margin-top:14px;font-size:12px;color:var(--muted)}
.receipt{padding:16px;border-radius:14px;background:var(--brand-soft);color:var(--brand-strong);font-size:14px;line-height:1.5}
.receipt strong{display:block;margin-bottom:3px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.map-layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(250px,.55fr);gap:14px;align-items:stretch}
.trip-map{height:520px;border-radius:var(--radius);overflow:hidden;background:var(--surface-soft);isolation:isolate}
.map-index{padding:10px;display:flex;flex-direction:column;gap:6px;max-height:520px;overflow:auto}
.map-stop{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:center;padding:10px;border-radius:12px;background:var(--surface-strong);cursor:pointer;border:0;text-align:left;width:100%}
.map-stop:hover{background:var(--surface-soft)}
.map-stop-number{width:30px;height:30px;border-radius:10px;background:var(--brand-soft);color:var(--brand-strong);display:grid;place-items:center;font-size:11px;font-weight:800}
.map-stop strong{display:block;font-size:13px;line-height:1.25}.map-stop span{display:block;font-size:11px;line-height:1.35;color:var(--muted);margin-top:2px}
.route-pin{width:30px;height:30px;border-radius:10px;background:var(--brand-strong);color:#f4faf7;display:grid;place-items:center;font-size:11px;font-weight:820;border:2px solid #fff;box-shadow:0 3px 7px rgba(20,33,29,.24)}
.leaflet-popup-content-wrapper{border-radius:12px;box-shadow:0 6px 18px rgba(20,33,29,.18)}.leaflet-popup-content{margin:11px 13px;font:600 12px/1.35 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:#14211d}
.itinerary{max-width:840px}
.day{border-top:1px solid var(--line)}
.day:last-child{border-bottom:1px solid var(--line)}
.day summary{list-style:none;cursor:pointer;padding:22px 0 16px;display:flex;align-items:flex-start;gap:12px}
.day summary::-webkit-details-marker{display:none}
.day-number{color:var(--brand-strong);font-size:13px;font-weight:800;line-height:1.4;flex:0 0 auto;padding-top:1px}
.day-heading{min-width:0}
.day-title{display:block;font-size:17px;font-weight:760;line-height:1.3}
.day-meta{display:block;font-size:11px;color:var(--muted);margin-top:4px}
.day-chevron{margin-left:auto;color:var(--faint);transition:transform .2s ease}
.day[open] .day-chevron{transform:rotate(45deg)}
.places{padding:0 0 20px;display:grid}
.place{position:relative;display:grid;grid-template-columns:26px 68px minmax(0,1fr);gap:12px;align-items:start;min-height:86px;padding:6px 0}
.place-rail{align-self:stretch;position:relative;display:flex;justify-content:center;z-index:0}
.place-rail::after{content:"";position:absolute;top:26px;bottom:-6px;width:1px;background:var(--line);z-index:-1}
.place:last-child .place-rail::after{display:none}
.place-index{width:24px;height:24px;border-radius:50%;background:var(--brand-soft);color:var(--brand-strong);display:grid;place-items:center;font-size:10px;font-weight:820}
.place-media{width:68px;height:68px;position:relative}
.place-image{width:68px;height:68px;border-radius:11px;object-fit:cover;background:var(--surface-soft);display:block}
.place-content{min-width:0}
.place-top{display:flex;align-items:flex-start;gap:8px}
.place-title{font-size:16px;font-weight:700;line-height:1.3;min-width:0;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.place-sub{font-size:11px;color:var(--muted);line-height:1.4;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.place-foot{display:flex;align-items:center;gap:7px;margin-top:7px;font-size:10px;color:var(--muted)}
.place-origin{min-width:0;max-width:75%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.place-separator{width:3px;height:3px;border-radius:50%;background:var(--faint);flex:0 0 auto}
.state{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;color:var(--muted);white-space:nowrap}
.state::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.state.locked{color:var(--brand-strong)}
.contribute{display:grid;grid-template-columns:.8fr 1.2fr;gap:42px;padding:28px}
.contribute h2{font-size:30px;line-height:1.08;letter-spacing:-.04em;margin:0 0 10px}
.contribute p{font-size:14px;color:var(--muted);line-height:1.55;margin:0}
.field label{display:block;font-size:13px;font-weight:720;margin-bottom:8px}
textarea,input{width:100%;color:var(--ink);border:1px solid var(--line);background:var(--surface-strong);border-radius:14px}
textarea{min-height:118px;padding:14px;resize:vertical;line-height:1.5}
textarea::placeholder,input::placeholder{color:var(--faint);opacity:1}
.field-help{font-size:11px;color:var(--faint);margin:7px 0 12px;line-height:1.4}
.material-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0 12px}
.file-button{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 13px;border:1px solid var(--line);border-radius:12px;background:var(--surface-strong);font-size:12px;font-weight:730;cursor:pointer}
.file-button:hover{background:var(--surface-soft)}.file-button input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.material-count{font-size:11px;color:var(--muted)}
.material-preview{display:flex;gap:8px;overflow:auto;margin-bottom:12px}.material-preview:empty{display:none}
.material-thumb{width:68px;height:68px;border-radius:12px;object-fit:cover;background:var(--surface-soft);flex:0 0 auto}
.action{border:0;border-radius:12px;background:var(--brand-strong);color:#f4faf7;min-height:46px;padding:0 18px;font-size:14px;font-weight:760;cursor:pointer;transition:transform .15s ease,filter .2s ease;white-space:nowrap}
.action:hover{filter:brightness(1.08)}
.action.secondary{background:var(--surface-soft);color:var(--ink);border:1px solid var(--line)}
.feedback{display:none;margin-top:12px;padding:11px 12px;border-radius:12px;background:var(--brand-soft);color:var(--brand-strong);font-size:12px;line-height:1.45}
.feedback.show{display:block}
.footer{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:44px 0 8px;color:var(--faint);font-size:12px}
.footer strong{color:var(--ink)}
.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:rgba(9,18,14,.52);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.modal-card{width:min(390px,100%);background:var(--surface-strong);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px}
.modal-card h2{font-size:25px;letter-spacing:-.035em;margin:0 0 7px}
.modal-card p{font-size:13px;line-height:1.5;color:var(--muted);margin:0 0 18px}
.modal-card label{display:block;font-size:12px;font-weight:720;margin-bottom:7px}
.modal-card input{height:46px;padding:0 13px;margin-bottom:16px}
.emoji-list{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-bottom:18px}
.emoji-button{aspect-ratio:1;border:1px solid var(--line);border-radius:12px;background:var(--surface-soft);font-size:19px;cursor:pointer}
.emoji-button.selected{border:2px solid var(--brand);background:var(--brand-soft)}
.modal-actions{display:grid;grid-template-columns:.65fr 1.35fr;gap:9px}
.toast{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));z-index:30;transform:translate(-50%,18px);opacity:0;pointer-events:none;background:var(--ink);color:var(--surface-strong);padding:11px 15px;border-radius:var(--pill);font-size:12px;font-weight:680;box-shadow:var(--shadow);transition:opacity .2s ease,transform .2s ease}
.toast.show{opacity:1;transform:translate(-50%,0)}
.error-page{min-height:calc(100dvh - 72px);display:grid;place-items:center;text-align:center;padding:40px}
.error-page .panel{max-width:460px;padding:32px}
.error-page h1{font-size:36px;max-width:none;margin:0 0 12px}
.error-page p{color:var(--muted);line-height:1.55;margin:0}
.skeleton-hero{min-height:560px;display:grid;grid-template-columns:1fr 1fr;gap:46px;align-items:center}
.skeleton-lines,.skeleton-photo,.skeleton-card{background:linear-gradient(100deg,var(--surface-soft) 20%,var(--surface-strong) 40%,var(--surface-soft) 60%);background-size:240% 100%;animation:shimmer 1.5s infinite;border-radius:var(--radius)}
.skeleton-lines{height:220px}.skeleton-photo{height:470px}.skeleton-card{height:160px;margin-top:14px}
@keyframes shimmer{to{background-position:-220% 0}}
@media(prefers-reduced-motion:no-preference){.hero-copy,.media-grid{animation:enter .65s cubic-bezier(.16,1,.3,1) both}.media-grid{animation-delay:.08s}.decision,.day{animation:enter .5s cubic-bezier(.16,1,.3,1) both}@keyframes enter{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
@media(max-width:820px){
  .shell{padding:0 16px 56px}.topbar{height:62px}.hero{grid-template-columns:1fr;gap:26px;min-height:auto;padding:30px 0 48px}.hero-copy{max-width:none}h1{font-size:clamp(42px,13vw,62px);max-width:9ch}.media-grid{height:390px;grid-template-columns:1.5fr .9fr}.section{padding-top:56px}.options,.map-layout{grid-template-columns:1fr}.trip-map{height:420px}.map-index{max-height:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.contribute{grid-template-columns:1fr;gap:22px}.skeleton-hero{grid-template-columns:1fr;min-height:auto;padding-top:30px}.skeleton-lines{height:210px}.skeleton-photo{height:360px}
}
@media(max-width:520px){
  .shell{padding-left:14px;padding-right:14px}.topbar{height:58px}.brand-mark{width:28px;height:28px}.identity{max-width:152px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hero{padding-top:22px}.hero-note{font-size:11px}h1{margin-top:18px;margin-bottom:16px}.hero-intro{font-size:15px}.trip-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:22px}.fact{min-width:0;padding:10px}.fact strong{font-size:15px}.media-grid{height:310px;gap:8px}.media{border-radius:15px}.section{padding-top:46px}.section-head{margin-bottom:18px}.summary-strip{align-items:flex-start;flex-direction:column;gap:5px;padding:16px}.decision{padding:16px}.decision-top{display:block}.deadline{text-align:left;margin-top:8px}.option{grid-template-columns:104px minmax(0,1fr);min-height:154px}.option-media{min-height:154px}.option-body{padding:13px}.vote-meta{display:block}.vote-meta span{display:block;margin-top:5px}.trip-map{height:360px}.map-index{display:flex;max-height:230px}.day summary{padding:18px 0 14px}.day-number{font-size:12px}.day-title{font-size:15px}.place{grid-template-columns:24px 58px minmax(0,1fr);gap:10px;min-height:76px}.place-media,.place-image{width:58px;height:58px}.place-origin{max-width:68%}.contribute{padding:20px}.footer{display:block;line-height:1.6}.footer span{display:block;margin-top:4px}
}
</style>
</head>
<body>
<main class="shell" id="app" aria-live="polite">
  <div class="topbar"><div class="brand"><span class="brand-mark">S</span><span>Settled</span></div></div>
  <div class="skeleton-hero"><div class="skeleton-lines"></div><div class="skeleton-photo"></div></div>
  <div class="skeleton-card"></div><div class="skeleton-card"></div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
var PARAMS=new URLSearchParams(location.search),TOKEN=PARAMS.get('t'),API='https://vczrpehzrpnqajpwoiah.supabase.co/functions/v1/t';
var LOCAL_DEMO=PARAMS.get('demo')==='1'&&(location.hostname==='127.0.0.1'||location.hostname==='localhost');
var LANG=(navigator.language||'en').toLowerCase().indexOf('zh')===0?'zh':'en';

function load(restoreY){

}

function saveIdentity(){var input=document.getElementById('identityName'),name=input.value.trim();if(!name){input.focus();return}IDENTITY={name:name,emoji:SELECTED_EMOJI};localStorage.setItem('settled_id',JSON.stringify(IDENTITY));var modal=document.getElementById('identityModal');if(modal)modal.remove();var next=PENDING;PENDING=null;if(next)next();else render()}
function vote(decisionID,optionID){needIdentity(function(){if(BUSY)return;BUSY=true;render();showToast(tr('saving'));var y=window.scrollY;post({action:'vote',token:TOKEN,decision_id:decisionID,option_id:optionID||null,name:IDENTITY.name,emoji:IDENTITY.emoji}).then(function(){BUSY=false;return load(y)}).then(function(){showToast(tr('saved'))}).catch(function(){BUSY=false;render();showToast(tr('voteFailed'))})})}
function selectMaterials(files){MATERIAL_FILES=Array.prototype.slice.call(files||[],0,4);var count=document.getElementById('materialCount'),preview=document.getElementById('materialPreview');if(count)count.textContent=MATERIAL_FILES.length?tr('imageCount').replace('%d',MATERIAL_FILES.length):'';if(preview){preview.innerHTML='';MATERIAL_FILES.forEach(function(file){var image=document.createElement('img');image.className='material-thumb';image.alt='';image.src=URL.createObjectURL(file);image.onload=function(){URL.revokeObjectURL(image.src)};preview.appendChild(image)})}}
function compressMaterial(file){return new Promise(function(resolve,reject){var url=URL.createObjectURL(file),image=new Image();image.onload=function(){var scale=Math.min(1,1600/Math.max(image.naturalWidth,image.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));var context=canvas.getContext('2d');context.drawImage(image,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url);var result=canvas.toDataURL('image/jpeg',.78);if(result.length>4000000)reject(new Error('image too large'));else resolve(result)};image.onerror=function(){URL.revokeObjectURL(url);reject(new Error('image failed'))};image.src=url})}
function contribute(){var input=document.getElementById('contribution'),value=input.value.trim(),files=MATERIAL_FILES.slice();if(!value&&!files.length)return;needIdentity(function(){if(BUSY)return;BUSY=true;var button=document.getElementById('contributeButton'),feedback=document.getElementById('contributionFeedback'),results=[];button.disabled=true;button.textContent=tr('sending');var work=Promise.resolve();if(value)work=work.then(function(){return post({action:'contribute',token:TOKEN,content:value,name:IDENTITY.name,emoji:IDENTITY.emoji})}).then(function(result){results.push(result)});files.forEach(function(file){work=work.then(function(){return compressMaterial(file)}).then(function(imageData){return post({action:'contribute',token:TOKEN,content:value,image_base64:imageData,name:IDENTITY.name,emoji:IDENTITY.emoji})}).then(function(result){results.push(result)})});work.then(function(){BUSY=false;input.value='';MATERIAL_FILES=[];var picker=document.getElementById('materialInput');if(picker)picker.value='';selectMaterials([]);button.disabled=false;button.textContent=tr('send');var spotted=[];results.forEach(function(result){(result.spotted||[]).forEach(function(name){if(spotted.indexOf(name)<0)spotted.push(name)})});feedback.className='feedback show';feedback.innerHTML=esc(tr('sent'))+(spotted.length?'<br><strong>'+esc(tr('spotted'))+esc(spotted.join(', '))+'</strong>':'')}).catch(function(){BUSY=false;button.disabled=false;button.textContent=tr('send');feedback.className='feedback show';feedback.textContent=tr('failed')})})}
document.addEventListener('click',function(event){var button=event.target.closest('[data-vote-decision]');if(button)vote(button.dataset.voteDecision,button.dataset.voteOption)});
load();
</script>
</body>
</html>
