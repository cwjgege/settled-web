function selectMaterials(files){MATERIAL_FILES=Array.prototype.slice.call(files||[],0,4);var count=document.getElementById('materialCount'),preview=document.getElementById('materialPreview');if(count)count.textContent=MATERIAL_FILES.length?tr('imageCount').replace('%d',MATERIAL_FILES.length):'';if(preview){preview.innerHTML='';MATERIAL_FILES.forEach(function(file){var image=document.createElement('img');image.className='material-thumb';image.alt='';image.src=URL.createObjectURL(file);image.onload=function(){URL.revokeObjectURL(image.src)};preview.appendChild(image)})}}
function compressMaterial(file){return new Promise(function(resolve,reject){var url=URL.createObjectURL(file),image=new Image();image.onload=function(){var scale=Math.min(1,1600/Math.max(image.naturalWidth,image.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));var context=canvas.getContext('2d');context.drawImage(image,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url);var result=canvas.toDataURL('image/jpeg',.78);if(result.length>4000000)reject(new Error('image too large'));else resolve(result)};image.onerror=function(){URL.revokeObjectURL(url);reject(new Error('image failed'))};image.src=url})}
function contribute(){var input=document.getElementById('contribution'),value=input.value.trim(),files=MATERIAL_FILES.slice();if(!value&&!files.length)return;var send=function(){if(BUSY)return;BUSY=true;var button=document.getElementById('contributeButton'),feedback=document.getElementById('contributionFeedback'),results=[];button.disabled=true;button.textContent=tr('sending');if(LOCAL_DEMO){BUSY=false;input.value='';MATERIAL_FILES=[];selectMaterials([]);button.disabled=false;button.textContent=tr('send');feedback.className='feedback show';feedback.textContent=tr('sent');return}var work=Promise.resolve();if(value)work=work.then(function(){return post({action:'contribute',token:TOKEN,content:value,name:IDENTITY.name,emoji:IDENTITY.emoji})}).then(function(result){results.push(result)});files.forEach(function(file){work=work.then(function(){return compressMaterial(file)}).then(function(imageData){return post({action:'contribute',token:TOKEN,content:value,image_base64:imageData,name:IDENTITY.name,emoji:IDENTITY.emoji})}).then(function(result){results.push(result)})});work.then(function(){BUSY=false;input.value='';MATERIAL_FILES=[];var picker=document.getElementById('materialInput');if(picker)picker.value='';selectMaterials([]);button.disabled=false;button.textContent=tr('send');var spotted=[];results.forEach(function(result){(result.spotted||[]).forEach(function(name){if(spotted.indexOf(name)<0)spotted.push(name)})});feedback.className='feedback show';feedback.innerHTML=esc(tr('sent'))+(spotted.length?'<br><strong>'+esc(tr('spotted'))+esc(spotted.join(', '))+'</strong>':'')}).catch(function(){BUSY=false;button.disabled=false;button.textContent=tr('send');feedback.className='feedback show';feedback.textContent=tr('failed')})};if(isJoined())send();else joinTrip(send)}
document.addEventListener('click',function(event){var button=event.target.closest('[data-vote-decision]');if(button)vote(button.dataset.voteDecision,button.dataset.voteOption)});
document.addEventListener('error',function(event){var image=event.target;if(image&&image.matches&&image.matches('.hero-media img,.option-media img,.place-image')&&!image.dataset.fallback){image.dataset.fallback='1';image.src='triptide-cover.svg'}},true);
if(LOCAL_DEMO)DATA=DEMO_DATA;
load();
</script>
</body>
