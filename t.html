<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="查看行程、参与投票，并和朋友一起把旅行定下来。">

<style>
:root{
  color-scheme:light dark;
  --canvas:#edf3ef;--surface:#f8faf8;--surface-strong:#ffffff;--surface-soft:#e5eee9;
  --ink:#14211d;--muted:#5d6e67;--faint:#7b8a84;--line:#d4e0d9;
  --brand:#2f7d70;--brand-strong:#1b564d;--brand-soft:#d9ebe4;
  --shadow:0 18px 54px rgba(28,73,62,.12);--radius:18px;--pill:999px;
}
@media(prefers-color-scheme:dark){
  :root{
    --canvas:#111815;--surface:#17211d;--surface-strong:#1c2823;--surface-soft:#22312b;
    --ink:#eff6f2;--muted:#b5c4bd;--faint:#8fa098;--line:#30423a;
    --brand:#65b6a5;--brand-strong:#9ad3c6;--brand-soft:#243f37;
    --shadow:0 20px 60px rgba(0,0,0,.28)
  }
}
*{box-sizing:border-box}
html{background:var(--canvas);scroll-behavior:smooth}
body{margin:0;min-height:100dvh;background:var(--canvas);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,textarea,input{font:inherit}
button{color:inherit}
button:focus-visible,textarea:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 36%,transparent);outline-offset:3px}
.shell{width:min(1120px,100%);margin:0 auto;padding:0 24px 72px}
.topbar{height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:760;letter-spacing:-.02em}
.brand-mark{width:30px;height:30px;border-radius:10px;background:var(--brand-strong);color:var(--surface-strong);display:grid;place-items:center;font-weight:820;box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.identity{border:1px solid var(--line);background:var(--surface);min-height:40px;padding:0 14px;border-radius:var(--pill);font-size:13px;font-weight:680;cursor:pointer;transition:transform .2s ease,background .2s ease}
.identity:hover{background:var(--surface-strong)}
.identity:active,.action:active,.vote-button:active,.emoji-button:active{transform:translateY(1px) scale(.99)}
.hero{display:grid;grid-template-columns:minmax(0,.9fr) minmax(460px,1.1fr);gap:48px;align-items:center;min-height:min(670px,calc(100dvh - 72px));padding:28px 0 56px}
.hero-copy{max-width:520px}
.hero-note{display:inline-flex;align-items:center;min-height:32px;padding:0 12px;border:1px solid var(--line);border-radius:var(--pill);background:var(--surface);font-size:12px;font-weight:720;color:var(--brand-strong)}
h1{font-size:clamp(42px,6vw,76px);line-height:.96;letter-spacing:-.065em;margin:22px 0 20px;max-width:10ch}
.hero-intro{font-size:17px;line-height:1.6;color:var(--muted);max-width:42ch;margin:0}
.trip-facts{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.fact{min-width:104px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.fact strong{display:block;font-size:17px;letter-spacing:-.02em}
.fact span{display:block;margin-top:3px;font-size:11px;color:var(--faint)}
.media-grid{display:grid;grid-template-columns:1.45fr .85fr;grid-template-rows:1fr 1fr;gap:12px;height:520px}
.media{margin:0;overflow:hidden;border-radius:var(--radius);background:var(--surface-soft);box-shadow:var(--shadow);position:relative}
.media:first-child{grid-row:1/3}
.media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s cubic-bezier(.16,1,.3,1)}
.media:hover img{transform:scale(1.025)}
.section{padding:72px 0 0}
.section-head{max-width:660px;margin-bottom:24px}
.section-head h2{font-size:clamp(28px,4vw,46px);line-height:1.04;letter-spacing:-.045em;margin:0 0 10px}
.section-head p{font-size:15px;line-height:1.6;color:var(--muted);margin:0;max-width:58ch}
.summary-strip{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 20px;background:var(--brand-strong);color:#f4faf7;border-radius:var(--radius);margin-bottom:16px}
.summary-strip strong{font-size:16px}
.summary-strip span{font-size:13px;color:rgba(244,250,247,.76)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 8px 28px rgba(31,75,64,.06)}
.decision{padding:22px;margin-top:14px}
.decision-top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:18px}
.decision-type{font-size:12px;font-weight:760;color:var(--brand-strong);margin-bottom:7px}
.decision h3{font-size:22px;line-height:1.22;letter-spacing:-.025em;margin:0;max-width:32ch}
.deadline{font-size:12px;color:var(--muted);text-align:right;flex:0 0 auto}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.option{border:1px solid var(--line);background:var(--surface-strong);border-radius:15px;overflow:hidden;display:grid;grid-template-columns:132px minmax(0,1fr);min-height:174px;transition:border-color .2s ease,transform .2s ease}
.option:hover{border-color:color-mix(in srgb,var(--brand) 48%,var(--line));transform:translateY(-2px)}
.option.mine{border:2px solid var(--brand);background:var(--brand-soft)}
.option-media{margin:0;background:var(--surface-soft);min-height:174px}
.option-media img{width:100%;height:100%;object-fit:cover;display:block}
.option-body{padding:16px;display:flex;flex-direction:column;align-items:flex-start}
.option-title{font-size:16px;font-weight:760;line-height:1.25}
.option-sub{font-size:12px;color:var(--muted);line-height:1.45;margin-top:4px}
.option-fact{font-size:12px;line-height:1.45;color:var(--muted);margin:12px 0}
.option-price{font-size:13px;font-weight:720;margin-top:8px}
.vote-button{width:100%;min-height:42px;margin-top:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:13px;font-weight:740;cursor:pointer;transition:transform .15s ease,background .2s ease,color .2s ease}
.vote-button:hover{background:var(--surface-soft)}
.vote-button.mine{background:var(--brand-strong);border-color:var(--brand-strong);color:#f4faf7}
.vote-button:disabled,.action:disabled{opacity:.58;cursor:wait}
.vote-meta{display:flex;justify-content:space-between;gap:12px;margin-top:14px;font-size:12px;color:var(--muted)}
.receipt{padding:16px;border-radius:14px;background:var(--brand-soft);color:var(--brand-strong);font-size:14px;line-height:1.5}
.receipt strong{display:block;margin-bottom:3px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.itinerary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.day{overflow:hidden}
.day summary{list-style:none;cursor:pointer;padding:20px;display:flex;align-items:center;gap:14px}
.day summary::-webkit-details-marker{display:none}
.day-number{width:44px;height:44px;border-radius:14px;background:var(--brand-soft);color:var(--brand-strong);display:grid;place-items:center;font-size:13px;font-weight:800;flex:0 0 auto}
.day-title{font-size:16px;font-weight:750;line-height:1.3}
.day-meta{font-size:11px;color:var(--muted);margin-top:4px}
.day-chevron{margin-left:auto;color:var(--faint);transition:transform .2s ease}
.day[open] .day-chevron{transform:rotate(45deg)}
.places{padding:0 12px 12px}
.place{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;border-radius:14px;background:var(--surface-strong);margin-top:8px}
.place:first-child{margin-top:0}
.place-image{width:54px;height:54px;border-radius:12px;object-fit:cover;background:var(--surface-soft)}
.place-title{font-size:14px;font-weight:720;line-height:1.3}
.place-sub{font-size:11px;color:var(--muted);line-height:1.4;margin-top:3px}
.state{font-size:10px;font-weight:750;color:var(--muted);border:1px solid var(--line);border-radius:var(--pill);padding:5px 8px;white-space:nowrap}
.state.locked{background:var(--brand-strong);border-color:var(--brand-strong);color:#f4faf7}
.contribute{display:grid;grid-template-columns:.8fr 1.2fr;gap:42px;padding:28px}
.contribute h2{font-size:30px;line-height:1.08;letter-spacing:-.04em;margin:0 0 10px}
.contribute p{font-size:14px;color:var(--muted);line-height:1.55;margin:0}
.field label{display:block;font-size:13px;font-weight:720;margin-bottom:8px}
textarea,input{width:100%;color:var(--ink);border:1px solid var(--line);background:var(--surface-strong);border-radius:14px}
textarea{min-height:118px;padding:14px;resize:vertical;line-height:1.5}
textarea::placeholder,input::placeholder{color:var(--faint);opacity:1}
.field-help{font-size:11px;color:var(--faint);margin:7px 0 12px;line-height:1.4}
.action{border:0;border-radius:12px;background:var(--brand-strong);color:#f4faf7;min-height:46px;padding:0 18px;font-size:14px;font-weight:760;cursor:pointer;transition:transform .15s ease,filter .2s ease;white-space:nowrap}
.action:hover{filter:brightness(1.08)}
.action.secondary{background:var(--surface-soft);color:var(--ink);border:1px solid var(--line)}
.feedback{display:none;margin-top:12px;padding:11px 12px;border-radius:12px;background:var(--brand-soft);color:var(--brand-strong);font-size:12px;line-height:1.45}
.feedback.show{display:block}
.footer{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:44px 0 8px;color:var(--faint);font-size:12px}
.footer strong{color:var(--ink)}
.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:rgba(9,18,14,.52);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.modal-card{width:min(390px,100%);background:var(--surface-strong);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px}
.modal-card h2{font-size:25px;letter-spacing:-.035em;margin:0 0 7px}
.modal-card p{font-size:13px;line-height:1.5;color:var(--muted);margin:0 0 18px}
.modal-card label{display:block;font-size:12px;font-weight:720;margin-bottom:7px}
.modal-card input{height:46px;padding:0 13px;margin-bottom:16px}
.emoji-list{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-bottom:18px}
.emoji-button{aspect-ratio:1;border:1px solid var(--line);border-radius:12px;background:var(--surface-soft);font-size:19px;cursor:pointer}
.emoji-button.selected{border:2px solid var(--brand);background:var(--brand-soft)}
.modal-actions{display:grid;grid-template-columns:.65fr 1.35fr;gap:9px}
.toast{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));z-index:30;transform:translate(-50%,18px);opacity:0;pointer-events:none;background:var(--ink);color:var(--surface-strong);padding:11px 15px;border-radius:var(--pill);font-size:12px;font-weight:680;box-shadow:var(--shadow);transition:opacity .2s ease,transform .2s ease}
.toast.show{opacity:1;transform:translate(-50%,0)}
.error-page{min-height:calc(100dvh - 72px);display:grid;place-items:center;text-align:center;padding:40px}
.error-page .panel{max-width:460px;padding:32px}
.error-page h1{font-size:36px;max-width:none;margin:0 0 12px}
.error-page p{color:var(--muted);line-height:1.55;margin:0}
.skeleton-hero{min-height:560px;display:grid;grid-template-columns:1fr 1fr;gap:46px;align-items:center}
.skeleton-lines,.skeleton-photo,.skeleton-card{background:linear-gradient(100deg,var(--surface-soft) 20%,var(--surface-strong) 40%,var(--surface-soft) 60%);background-size:240% 100%;animation:shimmer 1.5s infinite;border-radius:var(--radius)}
.skeleton-lines{height:220px}.skeleton-photo{height:470px}.skeleton-card{height:160px;margin-top:14px}
@keyframes shimmer{to{background-position:-220% 0}}
@media(prefers-reduced-motion:no-preference){.hero-copy,.media-grid{animation:enter .65s cubic-bezier(.16,1,.3,1) both}.media-grid{animation-delay:.08s}.decision,.day{animation:enter .5s cubic-bezier(.16,1,.3,1) both}@keyframes enter{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
@media(max-width:820px){
  .shell{padding:0 16px 56px}.topbar{height:62px}.hero{grid-template-columns:1fr;gap:26px;min-height:auto;padding:30px 0 48px}.hero-copy{max-width:none}h1{font-size:clamp(42px,13vw,62px);max-width:9ch}.media-grid{height:390px;grid-template-columns:1.5fr .9fr}.section{padding-top:56px}.options,.itinerary{grid-template-columns:1fr}.contribute{grid-template-columns:1fr;gap:22px}.skeleton-hero{grid-template-columns:1fr;min-height:auto;padding-top:30px}.skeleton-lines{height:210px}.skeleton-photo{height:360px}
}
@media(max-width:520px){
  .shell{padding-left:14px;padding-right:14px}.topbar{height:58px}.brand-mark{width:28px;height:28px}.identity{max-width:152px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hero{padding-top:22px}.hero-note{font-size:11px}h1{margin-top:18px;margin-bottom:16px}.hero-intro{font-size:15px}.trip-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:22px}.fact{min-width:0;padding:10px}.fact strong{font-size:15px}.media-grid{height:310px;gap:8px}.media{border-radius:15px}.section{padding-top:46px}.section-head{margin-bottom:18px}.summary-strip{align-items:flex-start;flex-direction:column;gap:5px;padding:16px}.decision{padding:16px}.decision-top{display:block}.deadline{text-align:left;margin-top:8px}.option{grid-template-columns:104px minmax(0,1fr);min-height:154px}.option-media{min-height:154px}.option-body{padding:13px}.vote-meta{display:block}.vote-meta span{display:block;margin-top:5px}.day summary{padding:16px}.place{grid-template-columns:48px minmax(0,1fr)}.place-image{width:48px;height:48px}.state{grid-column:2;justify-self:start}.contribute{padding:20px}.footer{display:block;line-height:1.6}.footer span{display:block;margin-top:4px}
}
</style>
</head>

return '<header class="hero"><div class="hero-copy"><span class="hero-note">'+esc(tr('shared'))+'</span><h1>'+esc(DATA.trip.name||DATA.trip.city||'Trip')+'</h1><p class="hero-intro">'+esc(tr('intro'))+'</p><div class="trip-facts"><div class="fact"><strong>'+esc(DATA.plans.length)+'</strong><span>'+esc(tr('days'))+'</span></div><div class="fact"><strong>'+esc(DATA.items.length)+'</strong><span>'+esc(tr('places'))+'</span></div><div class="fact"><strong>'+esc(Math.max(DATA.members.length,1))+'</strong><span>'+esc(tr('people'))+'</span></div></div></div><div class="media-grid" aria-label="'+esc(DATA.trip.city||DATA.trip.name)+'"><figure class="media">'+photo(a,(a&&a.title)||DATA.trip.city,(a&&a.title)||DATA.trip.city,false)+'</figure><figure class="media">'+photo(b,(b&&b.title)||DATA.trip.name,(b&&b.title)||'',true)+'</figure><figure class="media">'+photo(c,(c&&c.title)||DATA.trip.city,(c&&c.title)||'',true)+'</figure></div></header>';
}
function optionCard(option,decision,votes,mine){
var card=option.card_id?cardByID(option.card_id):null,isMine=mine===option.id,count=votes.filter(function(v){return v.option_id===option.id}).length;
var price=option.per_person_cents!=null?'<div class="option-price">$'+esc((option.per_person_cents/100).toFixed(0))+' / person</div>':'';
return '<article class="option'+(isMine?' mine':'')+'"><figure class="option-media">'+photo(card,option.title,option.title,true)+'</figure><div class="option-body"><div class="option-title">'+esc(option.title)+'</div><div class="option-sub">'+esc(option.subtitle||'')+'</div>'+price+'<div class="option-fact">'+esc(option.fact_line||'')+'</div><button class="vote-button'+(isMine?' mine':'')+'" aria-pressed="'+(isMine?'true':'false')+'" '+(BUSY?'disabled':'')+' data-vote-decision="'+esc(decision.id)+'" data-vote-option="'+(isMine?'':esc(option.id))+'">'+esc(isMine?tr('voted'):tr('vote'))+' ('+count+')</button></div></article>';
}
function renderDecision(decision){
var options=DATA.options.filter(function(option){return option.decision_id===decision.id}),votes=DATA.votes.filter(function(vote){return vote.decision_id===decision.id}),mine=null;
votes.forEach(function(vote){if(vote.member_name===myName())mine=vote.option_id});
if(decision.status==='settled')return '<article class="decision panel"><div class="decision-top"><div><div class="decision-type">'+esc(decision.slot||tr('settled'))+'</div><h3>'+esc(decision.question)+'</h3></div></div><div class="receipt"><strong>'+esc(tr('settled'))+'</strong>'+esc(decision.receipt||'')+'</div></article>';
var choices=options.map(function(option){return optionCard(option,decision,votes,mine)}).join('');
return '<article class="decision panel"><div class="decision-top"><div><div class="decision-type">'+esc(decision.slot||'')+'</div><h3>'+esc(decision.question)+'</h3></div>'+(decision.deadline_label?'<div class="deadline">'+esc(decision.deadline_label)+'</div>':'')+'</div><div class="options">'+choices+'</div><div class="vote-meta"><strong>'+votes.length+' '+esc(tr('votedCount'))+'</strong><span>'+esc(tr('silence'))+'</span></div></article>';
}
function renderDecisions(){
var open=DATA.decisions.filter(function(item){return item.status==='open'}),all=DATA.decisions;
var title=open.length+' '+tr(open.length===1?'openOne':'openMany');
var html='<section class="section" id="decisions"><div class="section-head"><h2>'+esc(title)+'</h2><p>'+esc(tr('voteHint'))+'</p></div>';
if(open.length)html+='<div class="summary-strip"><strong>'+esc(title)+'</strong><span>'+esc(dateText())+'</span></div>';
if(!all.length)html+='<div class="panel empty"><strong>'+esc(tr('noDecisions'))+'</strong><p>'+esc(tr('noDecisionsSub'))+'</p></div>';
else all.forEach(function(decision){html+=renderDecision(decision)});
return html+'</section>';
}
function renderDay(day){
var items=DATA.items.filter(function(item){return item.day_plan_id===day.id}).sort(function(a,b){return a.position-b.position}),rows='';
items.forEach(function(item){var card=cardByID(item.card_id);if(!card)return;rows+='<article class="place"><img class="place-image" src="'+esc(photoURL(card,card.title))+'" alt="" width="108" height="108" loading="lazy"><div><div class="place-title">'+esc(card.title)+'</div><div class="place-sub">'+esc(card.area||card.summary||'')+'</div></div><span class="state '+esc(item.state)+'">'+esc(item.state==='locked'?tr('locked'):tr('draft'))+'</span></article>'});
return '<details class="day panel" open><summary><span class="day-number">'+esc(LANG==='zh'?(tr('day')+day.day_number):('D'+day.day_number))+'</span><span><span class="day-title">'+esc(day.theme||tr('plan'))+'</span><span class="day-meta">'+esc(day.plan_date||dateText())+' &nbsp; '+items.length+' '+esc(tr('places'))+'</span></span><span class="day-chevron">+</span></summary><div class="places">'+rows+'</div></details>';
}
function renderPlan(){var days=DATA.plans.map(renderDay).join('');return '<section class="section" id="plan"><div class="section-head"><h2>'+esc(tr('plan'))+'</h2><p>'+esc(tr('planSub'))+'</p></div>'+(days?'<div class="itinerary">'+days+'</div>':'<div class="panel empty">'+esc(tr('emptyPlan'))+'</div>')+'</section>'}
function renderContribution(){return '<section class="section"><div class="contribute panel"><div><h2>'+esc(tr('contribute'))+'</h2><p>'+esc(tr('contributeSub'))+'</p></div><div class="field"><label for="contribution">'+esc(tr('contributeLabel'))+'</label><textarea id="contribution" placeholder="'+esc(tr('contributePlaceholder'))+'"></textarea><div class="field-help">'+esc(tr('contributeHelp'))+'</div><button class="action" id="contributeButton" onclick="contribute()">'+esc(tr('send'))+'</button><div class="feedback" id="contributionFeedback" role="status"></div></div></div></section>'}
function render(){
var app=document.getElementById('app');
app.innerHTML='<nav class="topbar"><div class="brand"><span class="brand-mark">S</span><span>Settled</span></div><button class="identity" onclick="editIdentity()">'+esc(identityLabel())+'</button></nav>'+renderHero()+renderDecisions()+renderPlan()+renderContribution()+'<footer class="footer"><strong>Settled</strong><span>'+esc(tr('footer'))+'</span></footer>';
}
function load(restoreY){
if(!TOKEN){fail(tr('inactive'),tr('inactiveSub'));return}
fetch(API+'?t='+encodeURIComponent(TOKEN)+'&data=1',{cache:'no-store'}).then(function(response){if(!response.ok){var error=new Error('load');error.status=response.status;throw error}return response.json()}).then(function(data){DATA=data;render();if(typeof restoreY==='number')requestAnimationFrame(function(){scrollTo(0,restoreY)})}).catch(function(error){if(error&&error.status===404)fail(tr('inactive'),tr('inactiveSub'));else fail(tr('loadingFailed'),tr('loadingFailedSub'))})
}
function post(body){return fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(response){return response.json().catch(function(){return {}}).then(function(data){if(!response.ok)throw new Error(data.error||'request failed');return data})})}
function needIdentity(callback){if(IDENTITY){callback();return}PENDING=callback;openIdentity()}
function editIdentity(){PENDING=function(){render()};openIdentity()}
function openIdentity(){
SELECTED_EMOJI=(IDENTITY&&IDENTITY.emoji)||'🦊';var modal=document.createElement('div');modal.className='modal';modal.id='identityModal';modal.setAttribute('role','dialog');modal.setAttribute('aria-modal','true');modal.setAttribute('aria-labelledby','identityTitle');
modal.innerHTML='<div class="modal-card"><h2 id="identityTitle">'+esc(tr('who'))+'</h2><p>'+esc(tr('whoSub'))+'</p><label for="identityName">'+esc(tr('name'))+'</label><input id="identityName" maxlength="18" autocomplete="name" placeholder="'+esc(tr('namePlaceholder'))+'" value="'+esc((IDENTITY&&IDENTITY.name)||'')+'"><div class="emoji-list" id="emojiList"></div><div class="modal-actions"><button class="action secondary" onclick="closeIdentity()">'+esc(tr('cancel'))+'</button><button class="action" onclick="saveIdentity()">'+esc(tr('confirm'))+'</button></div></div>';
document.body.appendChild(modal);var list=document.getElementById('emojiList');['🦊','🐸','🐨','🦉','🐯','🐰'].forEach(function(emoji){var button=document.createElement('button');button.className='emoji-button'+(emoji===SELECTED_EMOJI?' selected':'');button.textContent=emoji;button.type='button';button.setAttribute('aria-label',emoji);button.onclick=function(){SELECTED_EMOJI=emoji;list.querySelectorAll('button').forEach(function(item){item.className='emoji-button'});button.className='emoji-button selected'};list.appendChild(button)});setTimeout(function(){document.getElementById('identityName').focus()},40)
}
function closeIdentity(){var modal=document.getElementById('identityModal');if(modal)modal.remove();PENDING=null}
function saveIdentity(){var input=document.getElementById('identityName'),name=input.value.trim();if(!name){input.focus();return}IDENTITY={name:name,emoji:SELECTED_EMOJI};localStorage.setItem('settled_id',JSON.stringify(IDENTITY));var modal=document.getElementById('identityModal');if(modal)modal.remove();var next=PENDING;PENDING=null;if(next)next();else render()}
function vote(decisionID,optionID){needIdentity(function(){if(BUSY)return;BUSY=true;render();showToast(tr('saving'));var y=window.scrollY;post({action:'vote',token:TOKEN,decision_id:decisionID,option_id:optionID||null,name:IDENTITY.name,emoji:IDENTITY.emoji}).then(function(){BUSY=false;return load(y)}).then(function(){showToast(tr('saved'))}).catch(function(){BUSY=false;render();showToast(tr('voteFailed'))})})}
function contribute(){var input=document.getElementById('contribution'),value=input.value.trim();if(!value)return;needIdentity(function(){if(BUSY)return;BUSY=true;var button=document.getElementById('contributeButton');button.disabled=true;button.textContent=tr('sending');post({action:'contribute',token:TOKEN,content:value,name:IDENTITY.name,emoji:IDENTITY.emoji}).then(function(result){BUSY=false;input.value='';button.disabled=false;button.textContent=tr('send');var feedback=document.getElementById('contributionFeedback');feedback.className='feedback show';feedback.innerHTML=esc(tr('sent'))+(result.count>0?'<br><strong>'+esc(tr('spotted'))+esc((result.spotted||[]).join(', '))+'</strong>':'')}).catch(function(){BUSY=false;button.disabled=false;button.textContent=tr('send');var feedback=document.getElementById('contributionFeedback');feedback.className='feedback show';feedback.textContent=tr('failed')})})}
document.addEventListener('click',function(event){var button=event.target.closest('[data-vote-decision]');if(button)vote(button.dataset.voteDecision,button.dataset.voteOption)});
load();
</script>
</body>
</html>
